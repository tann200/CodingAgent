[project]
name = "codingagent"
version = "0.1.0"
description = "Local coding agent orchestration using LM Studio / Ollama"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "requests>=2.32.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "textual>=8.1.0,<9.0.0",
  "openai>=1.50.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "typing-extensions>=4.11.0",
  "PyYAML>=6.0.2,<7.0.0",
  "langgraph>=1.1.0,<2.0.0",
  "langchain-core>=1.0.0,<2.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=5.0.0",
  "ruff==0.12.0",
  "black==23.9.0",
  "mypy>=1.0.0",
]

analytics = [
  "pandas>=2.0.0",
]

server = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
]

anthropic = [
  "anthropic>=0.25.0",
]

tokenizer = [
  "tiktoken>=0.6.0",
]

otel = [
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.scripts]
codingagent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/", "tui/"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841", "E741", "E731", "F821", "E702", "F401"]
"scripts/**" = ["E402", "F841"]
"tui/**" = ["E741", "F841", "F401", "E402"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
explicit_package_bases = true

[tool.codingagent]
# Project-local virtualenv that must be used for development and testing
venv = ".venv"
enforce_venv = true

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "types-requests>=2.33.0.20260518",
]
