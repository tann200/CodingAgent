[pytest]
addopts = -q --ignore=tests/_deprecated
testpaths = tests
python_files = test_*.py
markers =
    real_llm: tests that exercise real provider-manager or adapter flows
    integration: broader integration coverage that may depend on external systems
    sync_threads: run threading.Thread and ThreadPoolExecutor targets synchronously for deterministic tests
    lmstudio: tests specific to LM Studio provider behavior
    e2e: end-to-end workflow tests
    slow: tests that are slow by default outside CI
    scenario: scenario-style workflow and benchmark coverage
    ollama: tests specific to Ollama provider behavior
# Keep warning output terse when running tests interactively
filterwarnings = ignore::DeprecationWarning
