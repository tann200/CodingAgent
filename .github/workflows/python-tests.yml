name: Python CI - Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: |
          # Run only unit tests to keep CI fast
          pytest tests/unit -q
        env:
          CI: true

      - name: Check xfail decorator count
        run: |
          COUNT=$(grep -r "@pytest.mark.xfail" tests/ --include="*.py" | grep -v "^#\|#.*xfail" | wc -l | tr -d ' ')
          echo "Decorator-style xfail markers: $COUNT"
          [ "$COUNT" -le 2 ] || (echo "ERROR: Too many @pytest.mark.xfail decorators ($COUNT > 2). Fix failing tests instead of marking them xfail." && exit 1)

